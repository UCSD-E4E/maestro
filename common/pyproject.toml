[project]
name = "maestro-common"
version = "0.1.0"
description = "Shared Maestro code: Label Studio brush masks, rewards, bandit, query strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Label Studio brush RLE (ls_brush). Clients that never talk to Label Studio skip it.
ls = ["label-studio-sdk>=2.0"]
sim = ["matplotlib>=3.8"]

[project.scripts]
maestro-sim = "maestro_common.sim_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "label-studio-sdk>=2.0"]
