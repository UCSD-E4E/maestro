[project]
name = "maestro-trainer"
version = "0.2.0"
description = "Maestro trainer: model families (arms) that train and predict for Label Studio"
authors = [{ name = "Sean Perry", email = "sean.hyatt.perry@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "maestro-common",
    "numpy>=1.26",
    "pillow>=10",
    "torch>=2.4",
    "transformers>=4.51",
    "requests>=2.32",
]

[project.optional-dependencies]
# Reading images straight from cloud storage URLs (s3://, gs://).
cloud = ["fsspec>=2024.6", "s3fs>=2024.6", "gcsfs>=2024.6"]

[tool.uv.sources]
maestro-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_trainer"]
