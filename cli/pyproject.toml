[project]
name = "maestro-cli"
version = "0.1.2"
description = "Spin Maestro stacks up and down on Kubernetes"
authors = [{ name = "Sean Perry", email = "sean.hyatt.perry@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kubernetes>=32.0.0,<33",
    "click>=8.1.8,<9",
    "pygit2>=1.17.0,<2",
    "pyyaml>=6.0",
]

[project.scripts]
maestro_cli = "maestro_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maestro_cli"]
