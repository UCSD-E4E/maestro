name: Docker Images CI

# Builds both images on every run, with no path filters: `maestro_cli spin up`
# pulls scheduler:<branch> and trainer:<branch> together, so both tags must exist
# for every branch. Registry caching keeps the unchanged image's build fast.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [scheduler, trainer]
    env:
      IMAGE: ghcr.io/ucsd-e4e/maestro-${{ matrix.component }}
      TAG: ${{ github.ref == 'refs/heads/main' && 'main' || github.head_ref }}
    steps:
    -
      uses: actions/checkout@v4
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.component }}
        file: ${{ matrix.component }}/Dockerfile
        tags: ${{ env.IMAGE }}:${{ env.TAG }}
        push: true
        cache-from: type=registry,ref=${{ env.IMAGE }}:${{ env.TAG }}_cache
        cache-to: type=registry,ref=${{ env.IMAGE }}:${{ env.TAG }}_cache,mode=max
