# Standalone uv project (not in the root workspace) until the scheduler is
# rewritten as described in PLAN.md; its Docker build uses this folder only.
[project]
name = "maestro-scheduler"
version = "0.1.0"
description = "Handles creation and running of models and trainers for maestro"
authors = [{ name = "Sean Perry", email = "sean.hyatt.perry@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kubernetes>=30.1.0,<31",
    "python-socketio>=5.11.3,<6",
    "eventlet>=0.36.1,<0.37",
    "pyyaml>=6.0.2,<7",
    "pandas>=2.2.2,<3",
    "greenlet==3.0.*",
    "label-studio-ml",
]

[tool.uv]
package = false

[tool.uv.sources]
label-studio-ml = { git = "https://github.com/UCSD-E4E/label-studio-ml-backend", branch = "poetry" }
